# fhcloud-disks-upd.yml
#
# Authors:
#   Andreas Räder, https://github.com/raederan
#   Linus Schenk, https://github.com/cptnsloww
#
# Hypervisor/controller agnostic: no hardcoded device names
# (sda/vda/sdb/vdb/nvme...) or LVM VG/LV names anywhere.
# Root disk and additional disks are discovered dynamically at runtime.
#
# Requires collections:
#   community.general
#   ansible.posix

# ---------------------------------------------------------------------------
# Begin: Check Ansible User
# ---------------------------------------------------------------------------
- name: Check Ansible Connection and User
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  tasks:
    - name: Verify SSH connection
      ansible.builtin.wait_for_connection:

    - name: Fail reliably if 'ansible_user' is not defined
      ansible.builtin.fail:
        msg: "You need to set the ansible_user by using the flag -u <USERNAME> when running the playbook!"
      when: ansible_user is not defined

    - name: Print 'ansible_user'
      ansible.builtin.debug:
        msg: "ansible_user: {{ ansible_user }}"
      when: ansible_user is defined
# End: Check Ansible User


# ---------------------------------------------------------------------------
# Begin: Resize root disk (fully dynamic — no hardcoded device/VG/LV)
# ---------------------------------------------------------------------------
- name: Resize root disk
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  become: true
  become_user: root
  tasks:
    - name: Find the block device backing the root filesystem
      ansible.builtin.set_fact:
        root_source: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='device') | first }}"

    - name: Resolve VG and LV name behind the root filesystem
      ansible.builtin.shell: |
        set -o pipefail
        lvs --noheadings -o vg_name,lv_name "{{ root_source }}" | xargs
      args:
        executable: /bin/bash
      register: root_vg_lv
      changed_when: false

    - name: Set root VG/LV facts
      ansible.builtin.set_fact:
        root_vg: "{{ root_vg_lv.stdout.split()[0] }}"
        root_lv: "{{ root_vg_lv.stdout.split()[1] }}"

    - name: Discover physical volume(s) belonging to the root VG
      ansible.builtin.shell: "pvs --noheadings -o pv_name -S vg_name={{ root_vg }}"
      register: root_pvs
      changed_when: false

    - name: Resize each physical volume to see the full underlying disk/partition
      ansible.builtin.command:
        cmd: "pvresize {{ item }}"
      loop: "{{ root_pvs.stdout_lines | map('trim') | list }}"
      changed_when: false

    - name: Extend the root logical volume to use all free space
      community.general.lvol:
        vg: "{{ root_vg }}"
        lv: "{{ root_lv }}"
        size: +100%FREE
        resizefs: true
# End: Resize root disk


# ---------------------------------------------------------------------------
# Begin: Update additional disks (auto-discovered, controller agnostic)
# ---------------------------------------------------------------------------
- name: Update additional disks
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  become: true
  become_user: root
  vars:
    # Default target state for auto-discovered disks.
    # Override with: -e disks_state=absent
    disks_state: "{{ disks_state | default('mounted') }}"

  tasks:
    - name: Find the block device backing the root filesystem
      ansible.builtin.set_fact:
        root_source: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='device') | first }}"

    - name: Determine the base disk name of the root device (handles LVM/mapper paths too)
      ansible.builtin.set_fact:
        root_disk: "{{ root_source | regex_replace('^/dev/(mapper/)?', '') | regex_replace('p?[0-9]+$', '') }}"

    - name: Auto-discover unpartitioned, non-root, non-removable disks
      ansible.builtin.set_fact:
        discovered_disks: "{{ discovered_disks | default({}) | combine({
            item.key: {
              'device': item.key,
              'part_suffix': ('p1' if item.key is match('^nvme') else '1'),
              'state': disks_state
            }
          }) }}"
      loop: "{{ ansible_devices | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.key != root_disk
        - item.key is match('^(sd|vd|xvd|nvme)[a-z0-9]+$')
        - item.value.partitions | length == 0
        - item.value.removable in ["0", 0, false, "false"]

    - name: Merge auto-discovered disks with any manually defined 'disks' var (manual entries win)
      ansible.builtin.set_fact:
        disks: "{{ discovered_disks | default({}) | combine(disks | default({})) }}"

    - name: Show final disk map that will be processed
      ansible.builtin.debug:
        var: disks

    - name: Update all disks block
      block:
        - name: Partition and format additional disks
          community.general.parted:
            device: "/dev/{{ item.value.device }}"
            number: 1
            state: present
            fs_type: ext4
          loop: "{{ disks | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Create filesystem on partitions
          community.general.filesystem:
            fstype: ext4
            dev: "/dev/{{ item.value.device }}{{ item.value.part_suffix }}"
            opts: "-L {{ item.key }}"
          loop: "{{ disks | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Create directories for mounting
          ansible.builtin.file:
            path: "/mnt/{{ item.key }}"
            state: directory
          loop: "{{ disks | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Mount all additional disks
          ansible.posix.mount:
            path: "/mnt/{{ item.key }}"
            src: "LABEL={{ item.key }}"
            fstype: ext4
            state: "{{ item.value.state }}"
          loop: "{{ disks | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

      when: disks is defined and disks | length > 0
# End: Update additional disks
