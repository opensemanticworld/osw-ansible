# Begin: Check Ansible User
- name: Check Ansible Connection and User
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  tasks:
    - name: Verify SSH connection
      ansible.builtin.wait_for_connection:

    - name: Fail reliably if 'ansible_user' is not defined
      fail:
        msg: "You need to set the ansible_user by using the flag -u <USERNAME> when running the playbook!"
      when: ansible_user is not defined

    - name: Print 'ansible_user'
      debug:
        msg: "ansible_user: {{ ansible_user }}"
      when: ansible_user is defined
# End: Check Ansible User

# Begin: Resize root disk
- name: Resize root disk
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  become: true
  become_user: root
  tasks:
    - name: Extend the logical volume
      ansible.builtin.command:
        cmd: pvresize /dev/sda3
      changed_when: false

    - name: Resize the filesystem
      lvol: 
        vg: ubuntu-vg
        lv: ubuntu-lv
        size: +100%FREE
        resizefs: true
# End: Resize root disk

# Begin: Update additional disks
- name: Update additional disks
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  become: true
  become_user: root
  tasks:
    - name: Update all disks block
      block:
      - name: Debug disks
        debug:
          var: disks

      - name: Partition and format additional disks
        community.general.parted:
          device: "/dev/{{ item.value.device }}"
          number: 1
          state: present
          fs_type: ext4
        with_dict: "{{ disks }}"
        register: partitioned_disks

      - name: Create filesystem on partitions
        community.general.filesystem:
          fstype: ext4
          dev: "/dev/{{ item.value.device }}1"
          opts: "-L {{ item.key }}" # label
        with_dict: "{{ disks }}"

      - name: Create directories for mounting
        file:
          path: "/mnt/{{ item.key }}"
          state: directory
        with_dict: "{{ disks }}"       

      - name: Mount all additional disks
        mount:
          path: "/mnt/{{ item.key }}"
          src: "LABEL={{ item.key }}"
          # src: "/dev/{{ item.value.device }}1"
          fstype: ext4
          state: "{{ item.value.state }}"
        with_dict: "{{ disks }}"

      when: disks is defined


